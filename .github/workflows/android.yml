name: Android build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Install Android build prerequisites
        run: |
          dotnet workload install maui-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debuggable APK
        run: dotnet build AndroidHelloWorld.sln -c Debug -p:EmbedAssembliesIntoApk=true
      - name: Publish ARM64 Release
        run: dotnet publish AndroidHelloWorld.csproj -c Release -p:PublishProfile=FolderProfile
      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-debug
          path: bin/Debug/net10.0-android36.0/*-Signed.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release-unsigned
          path: bin/Release/net10.0-android36.0/publish/android-arm64/com.example.androidhelloworld.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-release-unsigned
          path: ${{ runner.temp }}/release
      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the $name repository secret before publishing a release."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/release/com.example.androidhelloworld-Signed.apk" \
            "$RUNNER_TEMP/release/com.example.androidhelloworld.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "$RUNNER_TEMP/release/com.example.androidhelloworld-Signed.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/com.example.androidhelloworld-Signed.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
